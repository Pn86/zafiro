name: Release Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate temp keystore
        run: |
          mkdir -p packing
          keytool -genkeypair -v -keystore packing/nexus_release.jks -alias zafiro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zafiro123 -keypass zafiro123 \
            -dname "CN=PnZafiro, OU=Dev, O=Pn86, L=CN, ST=CN, C=CN"
      - name: Build release
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_PASSWORD=zafiro123 \
            -PRELEASE_KEY_ALIAS=zafiro \
            -PRELEASE_KEY_PASSWORD=zafiro123
      - name: Show outputs
        if: always()
        run: ls -la app/build/outputs/apk/release/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PnZafiro-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pn-build-${{ github.run_number }}
          name: PnZafiro build ${{ github.run_number }}
          body: |
            PnZafiro（非官方 Pn 版，基于 Zafiro ${{ github.sha }}）
            粉色猫头图标 / 关于页精简 / 数据与官方版共用
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
